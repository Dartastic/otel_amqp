name: otel_amqp
description: >-
  OpenTelemetry instrumentation for dart_amqp by Dartastic.io. Adds standard
  OpenTelemetry observability to applications that use dart_amqp.
version: 0.2.2
repository: https://github.com/dartastic/otel_amqp
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dart_amqp: ^0.3.1
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
