name: otel_amqp
description: >-
  OpenTelemetry instrumentation for package:dart_amqp. Wraps AMQP (RabbitMQ)
  publishes and consumer messages in PRODUCER/CONSUMER spans following OTel
  messaging semconv.
version: 0.1.0-wip
repository: https://github.com/dartastic/otel_amqp
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dart_amqp: ^0.3.1
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
